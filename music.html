            style="cursor: pointer"

          ></i>
        </button>
      </div>
      <div>
        <i class="fa-solid fa-bars fa-xl"></i>
      </div>

    <section class="hero">
      <!-- <grid></grid> -->
      <!-- <div class="text-container-gradient"></div> -->
      <!-- <div class="text-container"></div> -->
      <!-- <i class="overlay circle top-left"></i> -->
      <i class="overlay plus bottom-right"></i>
      <div class="column gp-3">
        <h1 id="hero-title">
          <span>Music By CRNN</span>
        </h1>
        <p class="muted">
          A collection of snippets and demos that I've made.
        </p>
        <div class="project-footer">
          <a
            class="project-link"
            href="https://soundcloud.com/crnn1"
            target="_blank"
          >

          </a>
          <a
            class="project-link"

    <section class="songs">
      <div class="songs-grid"></div>
    </section>
    <div class="audio-player">
      <div class="row gp-1">
        <button id="previous-button">
          <i class="fa-solid fa-step-backward"></i>
        </button>
        <button id="play-button"><i class="fa-solid fa-play"></i></button>
        <button id="next-button">
          <i class="fa-solid fa-step-forward"></i>
        </button>
      </div>
      <div class="seek-bar-wrapper">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" max="100" />
        <span id="duration">0:00</span>
      </div>
      <!-- <input type="range" id="volume" min="0" max="1" step="0.01" value="1" /> -->
